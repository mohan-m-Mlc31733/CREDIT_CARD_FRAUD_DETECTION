# Optional: host the Python backend (real trained models) on Render.com
# Render -> New -> Blueprint -> pick this repo. It reads this file.
services:
  - type: web
    name: fraudshield-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
